<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Học tập Thông minh</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Decorators -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="app-container glass-panel">
        
        <!-- TRANG CHỦ (CHỌN MÔN) -->
        <div id="home-view" class="view-section">
            <div class="home-header">
                <div class="brand">
                    <div class="brand-icon"><i class='bx bx-book-reader'></i></div>
                    <h1>Cyber Learn</h1>
                </div>
                
                <div class="auth-section">
                    <button id="btn-login" class="btn-glass btn-login" onclick="loginWithGoogle()">
                        <i class='bx bxl-google'></i> Đăng nhập
                    </button>
                    <div id="user-profile" class="user-profile hidden">
                        <img id="user-avatar" src="" alt="Avatar">
                        <div class="user-info">
                            <span id="user-name"></span>
                            <span class="user-badge">Học viên</span>
                        </div>
                        <button onclick="logout()" class="btn-logout" title="Đăng xuất"><i class='bx bx-log-out'></i></button>
                    </div>
                </div>
            </div>

            <div class="welcome-text">
                <h2>Khám phá không gian học tập mới</h2>
                <p>Chọn môn học bên dưới để bắt đầu ôn tập với các chế độ thông minh.</p>
            </div>

            <div id="subject-list" class="subject-grid">
                <button class="subject-card" onclick="loadSubject('dic201', 'DIC201')">
                    <div class="card-icon dic-icon"><i class='bx bx-code-alt'></i></div>
                    <h3>DIC201</h3>
                    <p>Lý thuyết cốt lõi</p>
                    <div class="card-arrow"><i class='bx bx-right-arrow-alt'></i></div>
                </button>
                <button class="subject-card" onclick="loadSubject('mcp201', 'MCP201')">
                    <div class="card-icon mcp-icon"><i class='bx bx-chip'></i></div>
                    <h3>MCP201</h3>
                    <p>Vi điều khiển & Phần cứng</p>
                    <div class="card-arrow"><i class='bx bx-right-arrow-alt'></i></div>
                </button>
                <button class="subject-card" onclick="loadSubject('csd202', 'CSD202')">
                    <div class="card-icon csd-icon"><i class='bx bx-images'></i></div>
                    <h3>CSD202</h3>
                    <p>Đề thi trắc nghiệm Hình ảnh</p>
                    <div class="card-arrow"><i class='bx bx-right-arrow-alt'></i></div>
                </button>
            </div>
        </div>

        <!-- TRANG HỌC TẬP -->
        <div id="study-view" class="view-section hidden">
            <div class="header-top">
                <button onclick="goHome()" class="btn-glass btn-back">
                    <i class='bx bx-arrow-back'></i> Quay lại
                </button>
                <h2 id="current-subject-title" class="subject-title">Môn Học</h2>
            </div>

            <!-- Segmented Control -->
            <div class="segmented-control">
                <div class="slider" id="tab-slider"></div>
                <button id="tab-fc3d" class="tab-btn active" onclick="switchTab('flashcard-3d')">
                    <i class='bx bx-carousel'></i> Flashcard 3D
                </button>
                <button id="tab-fcrev" class="tab-btn" onclick="switchTab('flashcard-reveal')">
                    <i class='bx bx-layer'></i> Flashcard Trải
                </button>
                <button id="tab-quiz" class="tab-btn" onclick="switchTab('quiz')">
                    <i class='bx bx-task'></i> Trắc nghiệm
                </button>
            </div>

            <!-- 1. Flashcard 3D -->
            <div id="view-flashcard-3d" class="study-mode">
                <div class="progress-badge"><i class='bx bx-bar-chart-alt-2'></i> <span id="fc3d-counter"></span></div>
                <div class="scene">
                    <div class="card" id="flashcard-3d" onclick="this.classList.toggle('is-flipped')">
                        <div class="card__face card__face--front">
                            <div class="label-badge label-question">Câu hỏi</div>
                            <div class="card-content">
                                <div id="fc3d-term" class="term-content"></div>
                                <div id="fc3d-options" class="fc-options-list"></div>
                            </div>
                            <div class="card-hint"><i class='bx bx-tap'></i> Chạm để xem giải thích</div>
                        </div>
                        <div class="card__face card__face--back">
                            <div class="label-badge label-answer">Giải thích</div>
                            <div class="card-content">
                                <div id="fc3d-definition" class="def-content"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn-glass btn-nav" onclick="prevCard()"><i class='bx bx-chevron-left'></i> Trước</button>
                    <button class="btn-primary btn-nav" onclick="nextCard()">Tiếp theo <i class='bx bx-chevron-right'></i></button>
                </div>
            </div>

            <!-- 2. Flashcard Reveal -->
            <div id="view-flashcard-reveal" class="study-mode hidden">
                <div class="progress-badge"><i class='bx bx-bar-chart-alt-2'></i> <span id="fcrev-counter"></span></div>
                <div class="card-reveal-container">
                    <div class="card-reveal-question">
                        <div class="label-badge label-question mb-15">Câu hỏi</div>
                        <div id="fcrev-term" class="term-content"></div>
                        <div id="fcrev-options" class="fc-options-list"></div>
                    </div>
                    <div class="card-reveal-hint" id="fcrev-hint">
                        Nhấn <span>SPACE</span> hoặc <button class="btn-inline" onclick="revealAnswer()">Bấm vào đây</button> để xem giải thích
                    </div>
                    <div class="card-reveal-answer hidden" id="fcrev-answer">
                        <div class="label-badge label-answer mb-15">Giải thích chi tiết</div>
                        <div id="fcrev-definition" class="def-content"></div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn-glass btn-nav" onclick="prevCard()"><i class='bx bx-chevron-left'></i> Trước</button>
                    <button class="btn-primary btn-nav" onclick="nextCard()">Tiếp theo <i class='bx bx-chevron-right'></i></button>
                </div>
            </div>

            <!-- 3. Quiz Mode -->
            <div id="view-quiz" class="study-mode hidden">
                <div class="quiz-header">
                    <div class="progress-badge"><i class='bx bx-bar-chart-alt-2'></i> <span id="quiz-counter"></span></div>
                    <div class="score-badge"><i class='bx bx-medal'></i> <span id="quiz-score">Điểm: 0</span></div>
                </div>
                
                <div class="quiz-question-container">
                    <div id="quiz-question" class="term-content"></div>
                </div>
                
                <div class="quiz-options" id="quiz-options">
                    <!-- Options go here -->
                </div>

                <div id="quiz-reveal-answer" class="quiz-reveal-answer hidden">
                    <div class="label-badge label-answer mb-15"><i class='bx bx-bulb'></i> Giải thích chi tiết</div>
                    <div id="quiz-explanation" class="def-content"></div>
                </div>

                <div class="quiz-actions">
                    <button id="btn-next-quiz" class="btn-primary btn-large hidden" onclick="nextQuiz()">Câu tiếp theo <i class='bx bx-right-arrow-alt'></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script loading handler -->
    <script src="script.js"></script>
    <script type="module" src="firebase.js"></script>
</body>
</html>
